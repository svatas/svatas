name: Validate profile

on:
  pull_request:
    paths:
      - 'README*.md'
      - 'assets/**'
      - 'profile/**'
      - 'scripts/generate.py'
      - '.github/workflows/profile.yml'
  push:
    branches: [main]
    paths:
      - 'README*.md'
      - 'assets/**'
      - 'profile/**'
      - 'scripts/generate.py'
      - '.github/workflows/profile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify generated profile, SVGs and local links
        run: python3 scripts/generate.py --check
