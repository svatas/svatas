<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc" xml:lang="cs">
<title id="title">SVATAS // Human Source Code</title>
<desc id="desc">Svatopluk Vít. To zajímavé se děje mezi krabičkami. Z Karviné. Doma v Praze. 30 let propojuji systémy a lidi.</desc>
<rect x="1" y="1" width="1198" height="458" rx="18" fill="#171e25" stroke="#39434c"/>
<text x="52" y="51" font-family="'Courier New', monospace" font-size="19" font-weight="400" fill="#edb77b">SVATAS // HUMAN SOURCE CODE</text>
<text x="52" y="179" font-family="Arial, Helvetica, sans-serif" font-size="80" font-weight="700" fill="#f0f3f6">To zajímavé se děje</text>
<text x="52" y="274" font-family="Arial, Helvetica, sans-serif" font-size="80" font-weight="700" fill="#edb77b">mezi krabičkami.</text>
<path d="M52 335 H1148" fill="none" stroke="#39434c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="52" y="385" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#f0f3f6">Svatopluk Vít</text>
<text x="52" y="427" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#aab4bf">Z Karviné. Doma v Praze.</text>
<text x="738" y="386" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#aab4bf">30 let propojuji</text>
<text x="738" y="423" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#aab4bf">systémy a lidi.</text>
</svg>
